import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'

    // for code quality checking with sonarqube and jacoco
    //id 'org.sonarqube' version '4.4.1.3373'
    id 'org.sonarqube' version '7.3.1.8318'
    id 'jacoco'

    // features ci
   id 'checkstyle'
    id 'com.github.spotbugs' version '6.1.3'
}

group = 'co.istad'
version = '0.0.1-SNAPSHOT'
description = 'product-api-simple-demo'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-scalar:3.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.1.0-RC1'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.springframework.security:spring-security-test'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    //testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'me.paulschwarz:springboot4-dotenv:5.1.0'

    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.keycloak:keycloak-admin-client:23.0.7'
    implementation 'org.keycloak:keycloak-core:23.0.7'
    // mapstruct
    // Source: https://mvnrepository.com/artifact/org.mapstruct/mapstruct
   // implementation 'org.mapstruct:mapstruct:1.7.0.Beta1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // auto create container
    // spring-data-jpa, will configure datasource for you

    //runtimeOnly 'org.springframework.boot:spring-boot-docker-compose'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // mapstruct -> for mapping the data
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Unit Testing & Mockito
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}





//----------[ Spotbug configuration ]--------------
spotbugs {
    ignoreFailures = false
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('LOW')
}
spotbugsMain{
    enabled= false
    reports{
        html{
            required = true
            outputLocation = file("$buildDir/reports/spotbugs/main.html")
        }
        xml{
            required= true
            outputLocation = file("$buildDir/reports/spotbugs/main.xml")
        }
    }
}
// disable spotbugs for test sources to avoid false positive in unit test
spotbugsTest{
    enabled = false
}
// ------ [ Check style configuration ]--------
checkstyle{
    toolVersion = '10.15.0'
    ignoreFailures = false
    maxWarnings=0
}
tasks.withType(Checkstyle).configureEach {
    reports{
        xml.required = true
        html.required = true
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // for jacoco coverage
    finalizedBy jacocoTestReport
}
jacocoTestReport{
    dependsOn test
    reports{
        xml.required = true
        csv.required = false
        html.required = true
    }
}


sonar{
    properties{
        property "sonar.projectKey", "ecommerce-spring-api"
        property "sonar.projectName", "ECommerce-Spring-API"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
    }
}